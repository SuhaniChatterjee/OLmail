# Render Blueprint: New -> Blueprint -> pick this repo. Everything here is on the free plan.
services:
  # API and worker in one process (free web services can't have a separate background worker)
  - type: web
    name: olmail-suhani-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:all
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: olmail-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: olmail-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://olmail-suhani.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Free web services can't reach SMTP ports, so mail goes through Mailtrap's HTTPS API
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_INBOX_ID
        sync: false
      - key: BULL_BOARD_USER
        value: admin
      - key: BULL_BOARD_PASS
        generateValue: true

  - type: web
    name: olmail-suhani
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://olmail-suhani-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: keyvalue
    name: olmail-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: olmail-db
    plan: free
